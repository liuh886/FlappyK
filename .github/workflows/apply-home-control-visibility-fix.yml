name: Apply home control visibility fix

on:
  push:
    branches:
      - agent/console-game-home-menu

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply fix
        run: python scripts/fix-home-mobile-controls-visibility.py
      - name: Remove one-shot helper
        run: |
          rm scripts/fix-home-mobile-controls-visibility.py
          rm .github/workflows/apply-home-control-visibility-fix.yml
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add premium-ui-refinement.css scripts .github/workflows
          git commit -m "fix: keep gameplay controls out of home"
          git push origin HEAD:agent/console-game-home-menu
