name: Apply home integration fixes

on:
  push:
    branches:
      - agent/interactive-market-home-v2
    paths:
      - .github/workflows/apply-home-integration-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/interactive-market-home-v2
          fetch-depth: 0

      - name: Apply verified fixes
        run: python scripts/apply-home-integration-fixes.py

      - name: Commit clean product tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close interactive home regressions"
          git push origin HEAD:agent/interactive-market-home-v2
