name: Apply PR 50 final fix

on:
  push:
    branches:
      - agent/cloud-run-reliability-v2
  pull_request:

permissions:
  contents: write

concurrency:
  group: apply-pr50-final-fix
  cancel-in-progress: true

jobs:
  patch:
    if: github.ref_name == 'agent/cloud-run-reliability-v2' || github.head_ref == 'agent/cloud-run-reliability-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/cloud-run-reliability-v2
          fetch-depth: 0

      - name: Reconcile cloud profile cache with completed-run facts
        shell: python
        run: |
          from pathlib import Path

          membership_path = Path('membership.js')
          source = membership_path.read_text(encoding='utf-8')
          anchor = "        const profileBest = profileBestValue == null ? null : Number(profileBestValue);"
          insertion = "\n".join([
              anchor,
              "        const bestExcess = [profileBest, bestFromRuns].reduce((best, value) => (",
              "            Number.isFinite(value) && (best === null || value > best) ? value : best",
              "        ), null);",
          ])
          if source.count(anchor) != 1:
              raise SystemExit(f'Expected one profile-best anchor, found {source.count(anchor)}')
          source = source.replace(anchor, insertion, 1)

          old_assignment = "            bestExcess: Number.isFinite(profileBest) ? profileBest : bestFromRuns,"
          if source.count(old_assignment) != 1:
              raise SystemExit(f'Expected one best-excess assignment, found {source.count(old_assignment)}')
          source = source.replace(old_assignment, "            bestExcess,", 1)
          membership_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/cloud-history-fallback.test.js')
          test_source = test_path.read_text(encoding='utf-8')
          marker = "console.log('Cloud history null fallback contract passed.');"
          regression = """assert.match(
  membership,
  /const bestExcess = \[profileBest, bestFromRuns\]\.reduce/,
  'cloud history must reconcile the profile cache with run-derived facts',
);
assert.match(
  membership,
  /Number\.isFinite\(value\) && \(best === null \|\| value > best\)/,
  'a stale or zero profile cache must not lower a stronger completed-run result',
);

console.log('Cloud history null and stale-cache fallback contracts passed.');"""
          if test_source.count(marker) != 1:
              raise SystemExit('Expected cloud-history test marker was not found')
          test_path.write_text(test_source.replace(marker, regression, 1), encoding='utf-8')

      - name: Restore CI and commit only the product fix
        run: |
          set -euo pipefail
          node --check membership.js
          node tests/cloud-history-fallback.test.js
          rm -f .github/workflows/apply-pr50-final-fix.yml
          git checkout origin/master -- .github/workflows/validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add membership.js tests/cloud-history-fallback.test.js .github/workflows/validate.yml .github/workflows/apply-pr50-final-fix.yml
          git commit -m "fix: reconcile cloud profile cache with run facts [pr50-final-fix]"
          git push origin HEAD:agent/cloud-run-reliability-v2
