name: UI contract update once

on:
  push:
    branches:
      - refactor/ui-canonical
    paths:
      - .github/workflows/ui-contract-update-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/ui-canonical
          fetch-depth: 0
      - name: Rebind UI contracts to the canonical stylesheet
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          simple_reads = [
              'tests/visual-redesign-v1.test.js',
              'tests/pwa.test.js',
              'tests/ui-curation-geometry-contract.test.js',
              'tests/web-composition-contract.test.js',
              'tests/mobile-arcade-polish-contract.test.js',
              'tests/mobile-home-quality.test.js',
          ]
          for filename in simple_reads:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = text.replace("fs.readFileSync('premium-ui-refinement.css', 'utf8')", "fs.readFileSync('premium-ui.css', 'utf8')")
              text = text.replace("fs.readFileSync('home-story.css', 'utf8')", "fs.readFileSync('premium-ui.css', 'utf8')")
              path.write_text(text, encoding='utf-8')

          path = Path('tests/visual-redesign-v1.test.js')
          text = path.read_text(encoding='utf-8').replace(
              "Story redesign must stay in home-story.css.",
              "Story redesign must stay in the canonical premium-ui.css owner."
          )
          path.write_text(text, encoding='utf-8')

          path = Path('tests/pwa.test.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace("assert.ok(indexSource.includes('premium-ui-refinement.css'));", "assert.ok(!indexSource.includes('premium-ui-refinement.css'));")
          text = text.replace("assert.ok(indexSource.includes('home-story.css'));", "assert.ok(!indexSource.includes('home-story.css'));")
          text = text.replace("assert.ok(serviceWorkerSource.includes(\"'./premium-ui-refinement.css'\"));", "assert.ok(!serviceWorkerSource.includes(\"'./premium-ui-refinement.css'\"));")
          text = text.replace("assert.ok(serviceWorkerSource.includes(\"'./home-story.css'\"));", "assert.ok(!serviceWorkerSource.includes(\"'./home-story.css'\"));")
          path.write_text(text, encoding='utf-8')

          path = Path('tests/web-composition-contract.test.js')
          text = path.read_text(encoding='utf-8').replace(
              "assert.ok(serviceWorker.includes(\"'./home-story.css'\"));",
              "assert.ok(serviceWorker.includes(\"'./premium-ui.css'\"));\nassert.ok(!serviceWorker.includes(\"'./home-story.css'\"));"
          )
          path.write_text(text, encoding='utf-8')

          path = Path('tests/membership-contract.test.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace("  \"'./premium-ui-refinement.css'\",\n", '')
          text = text.replace("  \"'./home-story.css'\",\n", '')
          marker = "for (const retiredAsset of [\n"
          insert = "assert.ok(!serviceWorkerSource.includes(\"'./premium-ui-refinement.css'\"));\nassert.ok(!serviceWorkerSource.includes(\"'./home-story.css'\"));\n"
          if insert not in text:
              text = text.replace(marker, insert + marker)
          path.write_text(text, encoding='utf-8')

          path = Path('docs/UI_ARCHITECTURE.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '`premium-ui.css` and `premium-ui-refinement.css` rebuilt the same selectors as a modern pixel game.',
              '`premium-ui.css` is the canonical modern-pixel visual owner; refinement and home-story rules are consolidated into it.'
          )
          text = text.replace(
              '- `premium-ui-refinement.css` owns the current modern-pixel theme and responsive scale.',
              '- `premium-ui.css` owns the current modern-pixel theme, responsive scale, and home-story presentation.'
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit contract cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests docs/UI_ARCHITECTURE.md
          git commit -m "test(ui): bind remaining contracts to canonical owner"
          git push origin HEAD:refactor/ui-canonical
