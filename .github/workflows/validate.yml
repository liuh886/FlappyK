name: Apply focused PR 50 fix

on:
  push:
    branches:
      - agent/cloud-run-reliability-v2
  pull_request:

permissions:
  contents: write

concurrency:
  group: apply-pr50-fix
  cancel-in-progress: true

jobs:
  apply-fix:
    if: github.ref_name == 'agent/cloud-run-reliability-v2' || github.head_ref == 'agent/cloud-run-reliability-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: agent/cloud-run-reliability-v2
          fetch-depth: 0

      - name: Apply null-safe cloud-history fallback
        shell: python
        run: |
          from pathlib import Path

          path = Path('membership.js')
          source = path.read_text(encoding='utf-8')
          old = "        const profileBest = Number(profileResult.data?.best_excess);"
          new = "\n".join([
              "        const profileBestValue = profileResult.data?.best_excess;",
              "        const profileBest = profileBestValue == null ? null : Number(profileBestValue);",
          ])
          if source.count(old) != 1:
              raise SystemExit(f'Expected one cloud-history line, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

      - name: Restore repository workflow and commit product fix
        run: |
          set -euo pipefail
          node --check membership.js
          rm -f .github/workflows/apply-pr50-fix.yml
          git checkout origin/master -- .github/workflows/validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add membership.js .github/workflows/validate.yml .github/workflows/apply-pr50-fix.yml
          git commit -m "fix: preserve run-derived best excess [pr50-fix-applied]"
          git push origin HEAD:agent/cloud-run-reliability-v2
