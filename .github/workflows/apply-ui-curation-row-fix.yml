name: Apply final HUD row normalization

on:
  push:
    branches:
      - agent/ui-curation-pass

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ui-curation-pass

      - name: Normalize HUD row sizing and pixel controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          premium_path = Path('premium-ui-refinement.css')
          premium = premium_path.read_text()

          old_rail = """    display: grid;\n    align-items: stretch;\n    pointer-events: none;\n}"""
          new_rail = """    display: grid;\n    grid-template-rows: minmax(0, 1fr);\n    align-items: stretch;\n    pointer-events: none;\n}"""
          if old_rail not in premium:
              raise SystemExit('rail row anchor not found')
          premium = premium.replace(old_rail, new_rail, 1)

          old_children = """    inset: auto !important;\n    min-width: 0 !important;\n    margin: 0 !important;\n}"""
          new_children = """    inset: auto !important;\n    min-width: 0 !important;\n    min-height: 0 !important;\n    margin: 0 !important;\n}"""
          if old_children not in premium:
              raise SystemExit('rail child sizing anchor not found')
          premium = premium.replace(old_children, new_children, 1)
          premium_path.write_text(premium)

          style_path = Path('style.css')
          style = style_path.read_text()

          old_stats = """    border: 0 !important;\n    border-right: 1px solid var(--hud-divider) !important;\n}"""
          new_stats = """    border: 0 !important;\n    border-right: 1px solid var(--hud-divider) !important;\n    backdrop-filter: none !important;\n}"""
          if old_stats not in style:
              raise SystemExit('stats backdrop anchor not found')
          style = style.replace(old_stats, new_stats, 1)

          old_key = """        border: 1px solid #52647c !important;\n        background: var(--hud-cell) !important;\n        color: var(--hud-warning) !important;"""
          new_key = """        border: 1px solid #52647c !important;\n        border-radius: 0 !important;\n        background: var(--hud-cell) !important;\n        color: var(--hud-warning) !important;"""
          if old_key not in style:
              raise SystemExit('trade key radius anchor not found')
          style = style.replace(old_key, new_key, 1)
          style_path.write_text(style)
          PY

      - name: Commit and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/apply-ui-curation-row-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add premium-ui-refinement.css style.css .github/workflows/apply-ui-curation-row-fix.yml
          git commit -m "fix: normalize curated HUD row geometry"
          git push origin HEAD:agent/ui-curation-pass
