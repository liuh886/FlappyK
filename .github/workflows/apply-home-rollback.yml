name: Apply home rollback

on:
  push:
    branches:
      - agent/revert-home-market-v2

permissions:
  contents: write

jobs:
  rollback:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore previous home and retain safe hardening
        run: python scripts/apply-home-rollback.py
