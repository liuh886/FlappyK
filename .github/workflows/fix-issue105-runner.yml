name: Repair issue 105 patch runner

on:
  push:
    branches:
      - fix/frontend-performance-105

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/frontend-performance-105
          fetch-depth: 0
      - name: Repair current snapshot parser
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/issue105-audit.yml')
          text = path.read_text()
          old = """          prefix = 'const stockDataMeta = '\n          separator = ';\\nconst stockData = '\n          if not source.startswith(prefix) or separator not in source:\n              raise SystemExit('data.js does not match the canonical stockData snapshot format')\n          meta_raw, data_raw = source[len(prefix):].split(separator, 1)\n          data_raw = data_raw.strip()\n          if data_raw.endswith(';'):\n              data_raw = data_raw[:-1]\n          metadata = json.loads(meta_raw)\n          all_data = json.loads(data_raw)\n          market_dir = Path('data/markets')\n          market_dir.mkdir(parents=True, exist_ok=True)\n          for market in ('crypto', 'ashare', 'usstock'):\n              payload = all_data.get(market, {})\n              (market_dir / f'{market}.json').write_text(\n                  json.dumps(payload, ensure_ascii=False, separators=(',', ':')) + '\\n'\n              )\n          (market_dir / 'meta.json').write_text(\n              json.dumps(metadata, ensure_ascii=False, indent=2) + '\\n'\n          )\n          data_path.unlink()\n"""
          new = """          marker = 'const stockData = '\n          if marker not in source:\n              raise SystemExit('data.js does not define the canonical stockData snapshot')\n          data_raw = source.split(marker, 1)[1].strip()\n          if data_raw.endswith(';'):\n              data_raw = data_raw[:-1]\n          all_data = json.loads(data_raw)\n          market_dir = Path('data/markets')\n          market_dir.mkdir(parents=True, exist_ok=True)\n          for market in ('crypto', 'ashare', 'usstock'):\n              payload = all_data.get(market, {})\n              (market_dir / f'{market}.json').write_text(\n                  json.dumps(payload, ensure_ascii=False, separators=(',', ':')) + '\\n'\n              )\n          data_path.unlink()\n"""
          if old not in text:
              raise SystemExit('snapshot parser anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/issue105-audit.yml
          git commit -m "chore: read current FlappyK snapshot format"
          git push origin HEAD:fix/frontend-performance-105
