name: Issue 105 closeout patch

on:
  push:
    branches:
      - fix/frontend-performance-105

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/frontend-performance-105
          fetch-depth: 0
      - name: Apply performance and canvas fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected patch anchor missing: {path}')
              p.write_text(text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'expected regex patch anchor missing: {path}: {pattern}')
              p.write_text(updated)

          # Split the canonical snapshot into lazy market chunks, then retire data.js.
          data_path = Path('data.js')
          source = data_path.read_text()
          prefix = 'const stockDataMeta = '
          separator = ';\nconst stockData = '
          if not source.startswith(prefix) or separator not in source:
              raise SystemExit('data.js does not match the canonical stockData snapshot format')
          meta_raw, data_raw = source[len(prefix):].split(separator, 1)
          data_raw = data_raw.strip()
          if data_raw.endswith(';'):
              data_raw = data_raw[:-1]
          metadata = json.loads(meta_raw)
          all_data = json.loads(data_raw)
          market_dir = Path('data/markets')
          market_dir.mkdir(parents=True, exist_ok=True)
          for market in ('crypto', 'ashare', 'usstock'):
              payload = all_data.get(market, {})
              (market_dir / f'{market}.json').write_text(
                  json.dumps(payload, ensure_ascii=False, separators=(',', ':')) + '\n'
              )
          (market_dir / 'meta.json').write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + '\n'
          )
          data_path.unlink()

          Path('data-loader.js').write_text(r'''const stockData = { crypto: {}, ashare: {}, usstock: {} };

          (() => {
              'use strict';

              const MARKETS = Object.freeze(['crypto', 'ashare', 'usstock']);
              const pending = new Map();
              const loaded = new Set();

              function marketForLevel(level) {
                  if (Number(level) === 1) return 'crypto';
                  if (Number(level) === 2) return 'ashare';
                  return 'usstock';
              }

              async function loadMarket(market) {
                  if (!MARKETS.includes(market)) throw new Error(`Unknown market: ${market}`);
                  if (loaded.has(market)) return stockData[market];
                  if (pending.has(market)) return pending.get(market);

                  const request = fetch(`./data/markets/${market}.json`, { cache: 'force-cache' })
                      .then(async (response) => {
                          if (!response.ok) throw new Error(`${market} data request failed with ${response.status}`);
                          const payload = await response.json();
                          if (!payload || typeof payload !== 'object' || Array.isArray(payload)) {
                              throw new Error(`${market} data payload is invalid`);
                          }
                          stockData[market] = payload;
                          loaded.add(market);
                          document.dispatchEvent(new CustomEvent('flappyk:data-updated', {
                              detail: { market, assets: Object.keys(payload).length },
                          }));
                          return payload;
                      })
                      .finally(() => pending.delete(market));

                  pending.set(market, request);
                  return request;
              }

              function loadMarkets(markets) {
                  return Promise.all([...new Set(markets)].map(loadMarket));
              }

              window.FlappyKData = Object.freeze({
                  markets: () => [...MARKETS],
                  marketForLevel,
                  isLoaded: (market) => loaded.has(market),
                  loadMarket,
                  loadMarkets,
              });
          })();
          ''')

          # Canonical generator now emits the same market chunks; obsolete generators are removed below.
          replace_once('fetch_all_data.py',
              'from datetime import datetime, timezone\n',
              'from datetime import datetime, timezone\nfrom pathlib import Path\n')
          regex_once('fetch_all_data.py', r'\nwith open\("data\.js", "w", encoding="utf-8"\) as output:.*\Z', r'''
          output_dir = Path("data/markets")
          output_dir.mkdir(parents=True, exist_ok=True)
          for market, payload in all_data.items():
              (output_dir / f"{market}.json").write_text(
                  json.dumps(payload, ensure_ascii=False, separators=(",", ":")) + "\n",
                  encoding="utf-8",
              )
          (output_dir / "meta.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print("Done! Adjusted data and metadata written to data/markets/")
          ''')

          # Loader order and font discovery: no blocking data.js and no CSS @import.
          index = Path('index.html').read_text()
          index = index.replace(
              '    <link rel="canonical" href="https://liuh886.github.io/FlappyK/">\n',
              '    <link rel="canonical" href="https://liuh886.github.io/FlappyK/">\n'
              '    <link rel="preconnect" href="https://fonts.googleapis.com">\n'
              '    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'
          )
          index = index.replace(
              '    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">',
              '    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">'
          )
          index = index.replace(
              '    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js"',
              '    <script defer src="https://static.cloudflareinsights.com/beacon.min.js"'
          )
          index = index.replace('    <script src="data.js"></script>', '    <script src="data-loader.js"></script>')
          Path('index.html').write_text(index)

          for css_path in ('premium-ui.css', 'i18n.css'):
              css_file = Path(css_path)
              css = css_file.read_text()
              css = re.sub(r"^@import url\('https://fonts\.googleapis\.com/[^\n]+\);\n\n?", '', css, count=1)
              css_file.write_text(css)

          # Canvas backing store has one owner: game.js. Logical drawing coordinates stay in CSS pixels.
          old_resize = '''function resizeCanvas() {
              gameContainer.style.width = '100vw';
              gameContainer.style.height = '100dvh';
              gameContainer.style.border = 'none';
              gameContainer.style.boxShadow = 'none';

              const fallbackHeight = window.matchMedia("(max-width: 768px)").matches
                  ? window.innerHeight * 0.6
                  : window.innerHeight;

              canvas.width = canvas.clientWidth || window.innerWidth;
              canvas.height = canvas.clientHeight || fallbackHeight;

              if (typeof isPlaying !== 'undefined' && isPlaying) draw();
          }
          '''
          new_resize = '''let canvasCssWidth = 1;
          let canvasCssHeight = 1;

          function resizeCanvas() {
              gameContainer.style.width = '100vw';
              gameContainer.style.height = '100dvh';
              gameContainer.style.border = 'none';
              gameContainer.style.boxShadow = 'none';

              const fallbackHeight = window.matchMedia("(max-width: 768px)").matches
                  ? window.innerHeight * 0.6
                  : window.innerHeight;
              const cssWidth = Math.max(1, Math.round(canvas.clientWidth || window.innerWidth));
              const cssHeight = Math.max(1, Math.round(canvas.clientHeight || fallbackHeight));
              const dpr = Math.max(1, Number(window.devicePixelRatio) || 1);

              canvasCssWidth = cssWidth;
              canvasCssHeight = cssHeight;
              const backingWidth = Math.round(cssWidth * dpr);
              const backingHeight = Math.round(cssHeight * dpr);
              if (canvas.width !== backingWidth) canvas.width = backingWidth;
              if (canvas.height !== backingHeight) canvas.height = backingHeight;
              ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

              if (typeof isPlaying !== 'undefined' && isPlaying) draw();
          }
          '''
          replace_once('game.js', old_resize, new_resize)
          replace_once('game.js',
              "window.addEventListener('resize', resizeCanvas);\nsetTimeout(resizeCanvas, 100);\n\n// Set initial size\nresizeCanvas();",
              "window.addEventListener('resize', resizeCanvas, { passive: true });\nwindow.addEventListener('orientationchange', resizeCanvas, { passive: true });\nnew ResizeObserver(resizeCanvas).observe(canvas);\n\n// Set initial size\nresizeCanvas();")
          replace_once('game.js',
              '// Initial Speed UI Sync\nspeedBtn.innerText = `${speedMultiplier}x [←/→]`;\n',
              '''// Initial Speed UI Sync
          speedBtn.innerText = `${speedMultiplier}x [←/→]`;

          async function ensureLevelMarketData(levelNumber = level) {
              const dataApi = window.FlappyKData;
              if (!dataApi) throw new Error('Market data loader is unavailable');
              await dataApi.loadMarket(dataApi.marketForLevel(levelNumber));
          }

          function reportMarketLoadFailure(error) {
              console.error('FlappyK market data load failed:', error);
              window.alert('Market data could not be loaded. Check your connection and try again.');
          }
          ''')
          replace_once('game.js',
              '''startBtn.addEventListener('click', () => {
              startScreen.classList.remove('active');
              initAudio();
              startLevel();
          });''',
              '''startBtn.addEventListener('click', async () => {
              startBtn.disabled = true;
              try {
                  await ensureLevelMarketData();
                  startScreen.classList.remove('active');
                  initAudio();
                  startLevel();
              } catch (error) {
                  reportMarketLoadFailure(error);
              } finally {
                  startBtn.disabled = false;
              }
          });''')
          replace_once('game.js',
              '''nextBtn.addEventListener('click', () => {
              settlementScreen.classList.remove('active');
              startLevel();
          });
          restartBtn.addEventListener('click', () => {
              settlementScreen.classList.remove('active');
              level = 1;
              targetReturn = 0;
              collectedCards = [];
              startLevel();
          });''',
              '''nextBtn.addEventListener('click', async () => {
              nextBtn.disabled = true;
              try {
                  await ensureLevelMarketData();
                  settlementScreen.classList.remove('active');
                  startLevel();
              } catch (error) {
                  reportMarketLoadFailure(error);
              } finally {
                  nextBtn.disabled = false;
              }
          });
          restartBtn.addEventListener('click', async () => {
              level = 1;
              targetReturn = 0;
              collectedCards = [];
              restartBtn.disabled = true;
              try {
                  await ensureLevelMarketData(1);
                  settlementScreen.classList.remove('active');
                  startLevel();
              } catch (error) {
                  reportMarketLoadFailure(error);
              } finally {
                  restartBtn.disabled = false;
              }
          });''')
          replace_once('game.js',
              '''champagneRestartBtn.addEventListener('click', () => {
              champagneScreen.classList.remove('active');
              level = 1;
              targetReturn = 0;
              collectedCards = [];
              startLevel();
          });''',
              '''champagneRestartBtn.addEventListener('click', async () => {
              level = 1;
              targetReturn = 0;
              collectedCards = [];
              champagneRestartBtn.disabled = true;
              try {
                  await ensureLevelMarketData(1);
                  champagneScreen.classList.remove('active');
                  startLevel();
              } catch (error) {
                  reportMarketLoadFailure(error);
              } finally {
                  champagneRestartBtn.disabled = false;
              }
          });''')
          replace_once('game.js',
              '''    // In case data failed to fetch, fallback
              if (!stockData[currentMarket] || Object.keys(stockData[currentMarket]).length === 0) {
                  currentMarket = Object.keys(stockData).find(k => Object.keys(stockData[k]).length > 0);
              }
              
              const assets = Object.keys(stockData[currentMarket]);''',
              '''    if (!stockData[currentMarket] || Object.keys(stockData[currentMarket]).length === 0) {
                  throw new Error(`Market data is not loaded: ${currentMarket}`);
              }

              const assets = Object.keys(stockData[currentMarket]);''')
          game = Path('game.js').read_text()
          head, marker, draw_tail = game.partition('function draw() {')
          if not marker:
              raise SystemExit('game.js draw function missing')
          draw_tail = draw_tail.replace('canvas.width', 'canvasCssWidth').replace('canvas.height', 'canvasCssHeight')
          Path('game.js').write_text(head + marker + draw_tail)

          # Premium refinement remains a presentation synchronizer, never a canvas backing-store writer.
          refinement = Path('scripts/premium-ui-refinement.js').read_text()
          refinement = refinement.replace("    const canvasElement = document.getElementById('game-canvas');\n", '')
          refinement = re.sub(r'\n    function syncCanvasLayout\(\) \{.*?\n    \}\n\n    function syncComposition', '\n    function syncComposition', refinement, count=1, flags=re.S)
          refinement = refinement.replace('        syncCanvasLayout();\n', '')
          refinement = re.sub(r'\n    if \(canvasElement\) \{\n        new MutationObserver\(scheduleComposition\)\.observe\(canvasElement, \{.*?\n    \}\n', '\n', refinement, count=1, flags=re.S)
          refinement = refinement.replace('        syncCanvasLayout,\n', '')
          Path('scripts/premium-ui-refinement.js').write_text(refinement)

          # Supplemental QQQ is now sourced from the canonical US market chunk and hidden from random selection.
          Path('qqq-loader.js').write_text(r'''(() => {
              'use strict';

              const QQQ_NAME = 'QQQ';

              function syncOpenSelector() {
                  const marketSelect = document.getElementById('custom-market-select');
                  const assetSelect = document.getElementById('custom-asset-select');
                  if (!marketSelect || !assetSelect || marketSelect.value !== 'usstock') return;
                  if (!stockData.usstock?.[QQQ_NAME]?.length) return;
                  if (Array.from(assetSelect.options).some((option) => option.value === QQQ_NAME)) return;
                  const option = document.createElement('option');
                  option.value = QQQ_NAME;
                  option.textContent = QQQ_NAME;
                  assetSelect.appendChild(option);
                  const sorted = Array.from(assetSelect.options)
                      .sort((left, right) => left.textContent.localeCompare(right.textContent));
                  assetSelect.replaceChildren(...sorted);
              }

              function installCustomOnlyQQQ() {
                  const rows = stockData.usstock?.[QQQ_NAME];
                  if (!Array.isArray(rows) || rows.length < 250) return;
                  Object.defineProperty(stockData.usstock, QQQ_NAME, {
                      value: rows,
                      enumerable: false,
                      configurable: true,
                      writable: true,
                  });
                  syncOpenSelector();
              }

              document.addEventListener('flappyk:data-updated', (event) => {
                  if (event.detail?.market === 'usstock') installCustomOnlyQQQ();
              });
              document.getElementById('custom-market-select')?.addEventListener('change', () => window.setTimeout(syncOpenSelector, 0));
              const assetSelect = document.getElementById('custom-asset-select');
              if (assetSelect) new MutationObserver(syncOpenSelector).observe(assetSelect, { childList: true });
          })();
          ''')

          # Custom Challenge knows the market catalog without preloading market payloads.
          replace_once('custom-challenge.js',
              '''    function availableMarkets() {
                  return Object.keys(marketLabels).filter((market) =>
                      stockData[market] && Object.keys(stockData[market]).length > 0
                  );
              }''',
              '''    function availableMarkets() {
                  return window.FlappyKData?.markets?.() || Object.keys(marketLabels);
              }''')
          replace_once('custom-challenge.js', '\n        populateAssets();\n    }\n\n    function populateAssets() {', '\n    }\n\n    async function populateAssets() {')
          replace_once('custom-challenge.js',
              '''        const market = marketSelect.value;
                  const previousValue = assetSelect.value;
                  const assets = Object.keys(stockData[market] || {}).sort((a, b) => a.localeCompare(b));''',
              '''        const market = marketSelect.value;
                  const previousValue = assetSelect.value;
                  await window.FlappyKData.loadMarket(market);
                  const assets = Object.keys(stockData[market] || {}).sort((a, b) => a.localeCompare(b));''')
          replace_once('custom-challenge.js', '    function openCustomSelector() {', '    async function openCustomSelector() {')
          replace_once('custom-challenge.js',
              '''        populateMarkets();

                  if (customState.market && availableMarkets().includes(customState.market)) {
                      marketSelect.value = customState.market;
                      populateAssets();

                      if (customState.asset && Object.prototype.hasOwnProperty.call(
                          stockData[customState.market] || {},
                          customState.asset
                      )) {
                          assetSelect.value = customState.asset;
                      }
                  }

                  customScreen.classList.add('active');''',
              '''        populateMarkets();

                  if (customState.market && availableMarkets().includes(customState.market)) {
                      marketSelect.value = customState.market;
                  }
                  await populateAssets();
                  if (customState.market && customState.asset && Object.prototype.hasOwnProperty.call(
                      stockData[customState.market] || {},
                      customState.asset
                  )) {
                      assetSelect.value = customState.asset;
                  }

                  customScreen.classList.add('active');''')
          replace_once('custom-challenge.js', '    function startCustomChallenge({ reuseWindow = false } = {}) {', '    async function startCustomChallenge({ reuseWindow = false } = {}) {')
          replace_once('custom-challenge.js',
              '''        const market = marketSelect.value || customState.market;
                  const asset = assetSelect.value || customState.asset;
                  const data = stockData[market]?.[asset];''',
              '''        const market = marketSelect.value || customState.market;
                  const asset = assetSelect.value || customState.asset;
                  await window.FlappyKData.loadMarket(market);
                  const data = stockData[market]?.[asset];''')
          custom = Path('custom-challenge.js').read_text()
          custom = custom.replace('        openCustomSelector();\n        return true;', '        void openCustomSelector();\n        return true;')
          custom = custom.replace('            openCustomSelector();\n', '            void openCustomSelector();\n')
          custom = custom.replace("    marketSelect.addEventListener('change', populateAssets);", "    marketSelect.addEventListener('change', () => { void populateAssets(); });")
          custom = custom.replace('        startCustomChallenge({ reuseWindow: false });', '        void startCustomChallenge({ reuseWindow: false });')
          custom = custom.replace('        startCustomChallenge({ reuseWindow: true });', '        void startCustomChallenge({ reuseWindow: true });')
          custom = custom.replace('        openCustomSelector();\n    });', '        void openCustomSelector();\n    });')
          Path('custom-challenge.js').write_text(custom)

          # Daily Run loads all three markets only when the user requests the cross-market daily descriptor set.
          replace_once('daily-run.js',
              "        lastRecordedSignature: '',\n    };",
              "        lastRecordedSignature: '',\n        loading: false,\n        loadFailed: false,\n    };")
          replace_once('daily-run.js',
              '    state.descriptors = createDescriptors();\n',
              '''    async function ensureDescriptors() {
                  if (state.descriptors.length === 3) return true;
                  state.loading = true;
                  state.loadFailed = false;
                  renderDailySummary();
                  try {
                      await window.FlappyKData.loadMarkets(window.FlappyKData.markets());
                      state.descriptors = createDescriptors();
                      state.loadFailed = state.descriptors.length !== 3;
                  } catch (error) {
                      console.warn('Daily Run market data could not be loaded.', error);
                      state.descriptors = [];
                      state.loadFailed = true;
                  } finally {
                      state.loading = false;
                      renderDailySummary();
                  }
                  return state.descriptors.length === 3;
              }
          ''')
          replace_once('daily-run.js',
              '''        dailyButton.disabled = state.descriptors.length !== 3;
                  dailyButton.textContent = state.descriptors.length === 3
                      ? Number.isFinite(Number(todayBest)) ? 'REPLAY DAILY' : 'DAILY RUN'
                      : 'DAILY UNAVAILABLE';''',
              '''        dailyButton.disabled = state.loading;
                  dailyButton.textContent = state.loading
                      ? 'LOADING…'
                      : state.loadFailed
                          ? 'DAILY UNAVAILABLE'
                          : Number.isFinite(Number(todayBest)) ? 'REPLAY DAILY' : 'DAILY RUN';''')
          replace_once('daily-run.js', '    function startDailyRun() {', '    async function startDailyRun() {')
          replace_once('daily-run.js',
              '''        if (state.descriptors.length !== 3) {
                      window.alert('Today’s Daily Run is unavailable for the current market snapshot.');
                      return;
                  }

                  state.active = true;''',
              '''        if (!await ensureDescriptors()) {
                      window.alert('Today’s Daily Run is unavailable for the current market snapshot.');
                      return;
                  }

                  state.active = true;''')
          replace_once('daily-run.js', '        startDailyRun();\n    }, { capture: true });', '        void startDailyRun();\n    }, { capture: true });')

          # Friend Challenge validates shape first, then lazy-loads only the markets named by the challenge.
          replace_once('friend-challenge.js', '    function loadInviteFromLocation() {', '    async function loadInviteFromLocation() {')
          replace_once('friend-challenge.js',
              '''        const payload = codec.decodeChallenge(token);
                  if (!payload || !validateAgainstDataset(payload)) {
                      state.invite = null;
                      removeChallengeToken();
                      clearInviteVisual();
                      window.alert('This friend challenge is invalid or no longer matches the bundled market snapshot.');
                      return;
                  }

                  state.invite = payload;''',
              '''        const payload = codec.decodeChallenge(token);
                  if (!payload || !codec.validateChallengeShape(payload)) {
                      state.invite = null;
                      removeChallengeToken();
                      clearInviteVisual();
                      window.alert('This friend challenge is invalid.');
                      return;
                  }

                  if (startButton) startButton.disabled = true;
                  try {
                      await window.FlappyKData.loadMarkets(payload.g.map((descriptor) => descriptor.m));
                  } catch (error) {
                      console.warn('Friend challenge market data could not be loaded.', error);
                      return;
                  } finally {
                      if (startButton) startButton.disabled = false;
                  }
                  if (!validateAgainstDataset(payload)) {
                      state.invite = null;
                      removeChallengeToken();
                      clearInviteVisual();
                      window.alert('This friend challenge no longer matches the market snapshot.');
                      return;
                  }

                  state.invite = payload;''')
          friend = Path('friend-challenge.js').read_text()
          friend = friend.replace('        loadInviteFromLocation();\n    });', '        void loadInviteFromLocation();\n    });')
          friend = friend.replace('    loadInviteFromLocation();\n})();', '    void loadInviteFromLocation();\n})();')
          Path('friend-challenge.js').write_text(friend)

          # Service worker precaches the loader, not the multi-megabyte market payloads. JSON chunks enter runtime cache on use.
          replace_once('sw.js', "    './data.js',", "    './data-loader.js',")
          sw = Path('sw.js').read_text()
          if not sw.endswith('\n'):
              Path('sw.js').write_text(sw + '\n')

          # Data audit reads the canonical generated chunks directly.
          audit = Path('scripts/audit_bundled_data.py').read_text()
          audit = audit.replace('DATA_FILE = Path(__file__).resolve().parents[1] / "data.js"', 'DATA_DIR = Path(__file__).resolve().parents[1] / "data" / "markets"')
          audit = re.sub(
              r'def load_stock_data\(\) -> dict\[str, dict\[str, list\[dict\[str, Any\]\]\]\]:\n.*?\n\n\ndef rows_by_date',
              '''def load_stock_data() -> dict[str, dict[str, list[dict[str, Any]]]]:
              data: dict[str, dict[str, list[dict[str, Any]]]] = {}
              for market in ("crypto", "ashare", "usstock"):
                  path = DATA_DIR / f"{market}.json"
                  payload = json.loads(path.read_text(encoding="utf-8"))
                  if not isinstance(payload, dict):
                      raise RuntimeError(f"{path} does not contain a market object")
                  data[market] = payload
              return data


          def rows_by_date''',
              audit,
              count=1,
              flags=re.S,
          )
          Path('scripts/audit_bundled_data.py').write_text(audit)

          # Tests protect runtime behavior/ownership rather than retired file names.
          pwa = Path('tests/pwa.test.js').read_text()
          pwa = pwa.replace('assert.ok(pixelStyles.includes("family=Pixelify+Sans"));', '''assert.ok(indexSource.includes('rel="preconnect" href="https://fonts.googleapis.com"'));
          assert.ok(indexSource.includes('rel="preconnect" href="https://fonts.gstatic.com" crossorigin'));
          assert.ok(indexSource.includes('family=Pixelify+Sans'));
          assert.ok(!pixelStyles.includes('@import url('));''')
          pwa = pwa.replace('assert.ok(serviceWorkerSource.includes("\'./data.js\'"));', '''assert.ok(serviceWorkerSource.includes("'./data-loader.js'"));
          assert.ok(!serviceWorkerSource.includes("'./data.js'"));
          assert.ok(!serviceWorkerSource.includes("'./data/markets/crypto.json'"));''')
          Path('tests/pwa.test.js').write_text(pwa)

          i18n_test = Path('tests/i18n.test.js').read_text()
          i18n_test = i18n_test.replace(
              'assert.ok(cssSource.startsWith("@import url(\'https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou"));',
              '''assert.ok(indexSource.includes('family=ZCOOL+QingKe+HuangYou'));
          assert.ok(!cssSource.includes('@import url('));'''
          )
          Path('tests/i18n.test.js').write_text(i18n_test)

          web_contract = Path('tests/web-composition-contract.test.js').read_text()
          web_contract = web_contract.replace("const hardeningJs = fs.readFileSync('core-hardening.js', 'utf8');", "const hardeningJs = fs.readFileSync('core-hardening.js', 'utf8');\nconst gameJs = fs.readFileSync('game.js', 'utf8');")
