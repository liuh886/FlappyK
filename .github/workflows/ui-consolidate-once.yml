name: UI consolidate once

on:
  push:
    branches:
      - refactor/ui-canonical

permissions:
  contents: write

jobs:
  consolidate:
    if: github.event.head_commit.message == 'chore: run ui consolidation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ui-canonical
          fetch-depth: 0

      - name: Consolidate canonical UI styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          premium_path = root / 'premium-ui.css'
          refinement_path = root / 'premium-ui-refinement.css'
          story_path = root / 'home-story.css'
          index_path = root / 'index.html'

          premium = premium_path.read_text(encoding='utf-8')
          refinement = refinement_path.read_text(encoding='utf-8')
          story = story_path.read_text(encoding='utf-8')

          # CSS @import rules must remain before normal rules. Preserve the
          # refinement font import while keeping the original rule order.
          refinement_lines = refinement.splitlines()
          leading_imports = []
          body_start = 0
          for i, line in enumerate(refinement_lines):
              stripped = line.strip()
              if stripped.startswith('@import '):
                  leading_imports.append(line)
                  body_start = i + 1
                  continue
              if not stripped and i == body_start:
                  body_start = i + 1
                  continue
              break
          refinement_body = '\n'.join(refinement_lines[body_start:]).lstrip()

          merged = ''
          if leading_imports:
              merged += '\n'.join(leading_imports).rstrip() + '\n\n'
          merged += premium.rstrip() + '\n\n'
          merged += '/* Canonicalized from the former premium UI refinement layer. */\n'
          merged += refinement_body.rstrip() + '\n\n'
          merged += '/* Canonicalized from the former home story layer. */\n'
          merged += story.lstrip().rstrip() + '\n'
          premium_path.write_text(merged, encoding='utf-8')

          index = index_path.read_text(encoding='utf-8')
          index = index.replace('    <link rel="stylesheet" href="premium-ui-refinement.css">\n', '')
          index = index.replace('    <link rel="stylesheet" href="home-story.css">\n', '')
          index_path.write_text(index, encoding='utf-8')

          refinement_path.unlink()
          story_path.unlink()
          PY

      - name: Commit consolidation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add premium-ui.css index.html premium-ui-refinement.css home-story.css
          git commit -m "refactor(ui): consolidate final visual layers [ui-consolidated]"
          git push origin HEAD:refactor/ui-canonical

      - name: Install test dependencies
        run: npm ci

      - name: Validate static contracts
        run: npm run validate:static

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke suite
        run: npm run test:e2e
