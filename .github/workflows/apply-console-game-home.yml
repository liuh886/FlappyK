name: Apply console game home

on:
  push:
    branches:
      - agent/console-game-home-menu

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply curated console home
        run: python scripts/apply-console-game-home.py
      - name: Remove one-shot helper
        run: |
          rm scripts/apply-console-game-home.py
          rm .github/workflows/apply-console-game-home.yml
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add premium-ui-refinement.css home-story.css sw.js tests scripts .github/workflows
          git commit -m "style: adopt console-first home menu"
          git push origin HEAD:agent/console-game-home-menu
