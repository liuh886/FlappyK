name: Validate

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-and-data:
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - name: Check out change history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether browser acceptance is required
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > changed-files.txt
          cat changed-files.txt
          if grep -Eq '^(([^/]+\.(js|css|html|webmanifest))|scripts/.*\.(js|css)$|tests/e2e/|data/|icons/|package(-lock)?\.json|playwright\.config\.cjs|\.github/workflows/validate\.yml)' changed-files.txt; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
          else
            echo "browser=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate discovered JavaScript and product contracts
        run: npm run validate:static

      - name: Check Python syntax
        run: python3 -m py_compile fetch_all_data.py scripts/audit_bundled_data.py

      - name: Check HTML, committed social preview, and leaderboard data
        run: |
          python3 - <<'PY'
          import json
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          Parser().feed(Path("index.html").read_text(encoding="utf-8"))
          payload = json.loads(Path("data/leaderboard.json").read_text(encoding="utf-8"))
          entries = payload.get("entries", [])
          assert isinstance(entries, list)
          assert len(entries) <= 10

          image = Path("og-image.png").read_bytes()
          assert image[:8] == b"\x89PNG\r\n\x1a\n"
          width = int.from_bytes(image[16:20], "big")
          height = int.from_bytes(image[20:24], "big")
          assert (width, height) == (1200, 630), (width, height)
          print("HTML, social preview, and leaderboard data validated")
          PY

      - name: Audit bundled equity split continuity
        run: python3 scripts/audit_bundled_data.py

  browser-smoke:
    needs: static-and-data
    if: needs.static-and-data.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
