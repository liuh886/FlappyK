name: Apply curated UI geometry fix

on:
  push:
    branches:
      - agent/ui-curation-pass

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ui-curation-pass

      - name: Restore static HUD geometry ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          premium_path = Path('premium-ui-refinement.css')
          premium = premium_path.read_text()

          old = """#game-hud-rail > * {\n    min-width: 0;\n    pointer-events: auto;\n}\n\nhtml[data-virtual-controls='true'] #game-top-controls .desktop-speed-control {"""
          new = """#game-hud-rail > * {\n    min-width: 0;\n    pointer-events: auto;\n}\n\n#game-hud-rail .weather-status,\n#game-hud-rail .stats-box[data-composition='returns-only'],\n#game-hud-rail .run-progress-panel,\n#game-hud-rail #game-top-controls {\n    position: static !important;\n    inset: auto !important;\n    min-width: 0 !important;\n    margin: 0 !important;\n}\n\nhtml[data-virtual-controls='true'] #game-top-controls .desktop-speed-control {"""
          if old not in premium:
              raise SystemExit('desktop HUD structure anchor not found')
          premium = premium.replace(old, new, 1)

          old_mobile = """@media (max-width: 720px), (pointer: coarse) {\n    body::before {\n        opacity: 0.12;\n    }\n\n    html[data-ui-state='home'] #game-container.arcade-weather-ready {"""
          new_mobile = """@media (max-width: 720px), (pointer: coarse) {\n    body::before {\n        opacity: 0.12;\n    }\n\n    #game-hud-rail {\n        top: max(6px, env(safe-area-inset-top));\n        right: max(6px, env(safe-area-inset-right));\n        left: max(6px, env(safe-area-inset-left));\n        grid-template-areas:\n            'performance controls'\n            'weather progress';\n        grid-template-columns: minmax(0, 1fr) auto;\n        grid-template-rows: auto auto;\n    }\n\n    #game-hud-rail .stats-box[data-composition='returns-only'] {\n        grid-area: performance;\n    }\n\n    #game-hud-rail #game-top-controls {\n        grid-area: controls;\n    }\n\n    #game-hud-rail .weather-status {\n        grid-area: weather;\n    }\n\n    #game-hud-rail .run-progress-panel {\n        grid-area: progress;\n    }\n\n    html[data-ui-state='home'] #game-container.arcade-weather-ready {"""
          if old_mobile not in premium:
              raise SystemExit('mobile HUD structure anchor not found')
          premium = premium.replace(old_mobile, new_mobile, 1)
          premium_path.write_text(premium)

          style_path = Path('style.css')
          style = style_path.read_text()

          old_rail = """    min-height: 52px !important;\n    overflow: hidden !important;"""
          new_rail = """    min-height: 52px !important;\n    height: 52px !important;\n    overflow: hidden !important;"""
          if old_rail not in style:
              raise SystemExit('desktop rail height anchor not found')
          style = style.replace(old_rail, new_rail, 1)

          old_control = """    border: 1px solid #52647c !important;\n    background: var(--hud-cell) !important;"""
          new_control = """    border: 1px solid #52647c !important;\n    border-radius: 0 !important;\n    background: var(--hud-cell) !important;"""
          if old_control not in style:
              raise SystemExit('HUD control radius anchor not found')
          style = style.replace(old_control, new_control, 1)

          old_mobile_rail = """        min-height: 78px !important;\n    }"""
          new_mobile_rail = """        min-height: 78px !important;\n        height: auto !important;\n    }"""
          if old_mobile_rail not in style:
              raise SystemExit('mobile rail height anchor not found')
          style = style.replace(old_mobile_rail, new_mobile_rail, 1)
          style_path.write_text(style)
          PY

      - name: Commit geometry fix and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/apply-ui-curation-geometry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add premium-ui-refinement.css style.css .github/workflows/apply-ui-curation-geometry.yml
          git commit -m "fix: close curated UI geometry regressions"
          git push origin HEAD:agent/ui-curation-pass
